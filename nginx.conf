server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;

    add_header Content-Security-Policy "default-src * 'self' data: blob: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
